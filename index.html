<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Designer.png">
    <title>image gallery</title>
    <style>
        #mobile-blocker {
            display: none;
            color: #fff;
            text-align: center;
            padding: 40px 20px;
        }

        @media (max-width: 767px) and (hover: none) {
            .gallery-container {
                display: none !important;
            }

            #mobile-blocker {
                display: flex !important;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 80vh;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #020751;
            background: -moz-linear-gradient(left, #020751 0%, #042A6A 0%, #0B41B4 100%);
            background: -webkit-linear-gradient(left, #020751 0%, #042A6A 0%, #0B41B4 100%);
            background: linear-gradient(to right, #020751 0%, #042A6A 0%, #0B41B4 100%);
            min-height: 100vh;
            color: #333;
            padding: 40px 20px;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .gallery-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .gallery-header p {
            color: #e9e5e5;
            font-size: 1.1rem;
        }


        .header-buttons {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            gap: 12px;
        }

        .circle-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .circle-btn:hover {
            transform: scale(1.12);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
        }

        .circle-btn:active {
            transform: scale(0.95);
        }

        .btn-green {
            background: #0F7A17;
            background: -moz-linear-gradient(left, #0F7A17 0%, #0F8E10 0%, #27BC0C 100%);
            background: -webkit-linear-gradient(left, #0F7A17 0%, #0F8E10 0%, #27BC0C 100%);
            background: linear-gradient(to right, #0F7A17 0%, #0F8E10 0%, #27BC0C 100%);
        }

        .btn-blue {
            background: #020751;
            background: -moz-linear-gradient(left, #020751 0%, #042A6A 0%, #0B41B4 100%);
            background: -webkit-linear-gradient(left, #020751 0%, #042A6A 0%, #0B41B4 100%);
            background: linear-gradient(to right, #020751 0%, #042A6A 0%, #0B41B4 100%);
        }

        .btn-red {
            background: #B70000;
            background: -moz-linear-gradient(45deg, #B70000 0%, #B20000 36%, #FF0017 100%);
            background: -webkit-linear-gradient(45deg, #B70000 0%, #B20000 36%, #FF0017 100%);
            background: linear-gradient(45deg, #B70000 0%, #B20000 36%, #FF0017 100%);
        }

        .btn-purple {
            background: #2F0453;
            background: -moz-linear-gradient(left, #2F0453 0%, #490281 0%, #7B00D3 100%);
            background: -webkit-linear-gradient(left, #2F0453 0%, #490281 0%, #7B00D3 100%);
            background: linear-gradient(to right, #2F0453 0%, #490281 0%, #7B00D3 100%);
        }

        .gallery-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            max-width: 400px;
            margin: 0 auto 40px auto;
        }

        #Input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
            color: rgb(8, 8, 8);
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            font-weight: bold;
        }

        #Input:focus {
            border-color: #111;
            box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.05);
        }

        #fileinput {
            width: 100%;
            padding: 8px;
            font-size: 0.95rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        #fileinput:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.6);
        }

        #fileinput::file-selector-button {
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            background-color: #fff;
            color: #111;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 12px;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        #fileinput::file-selector-button:hover {
            background-color: #e9e5e5;
        }

        #fileinput::file-selector-button:active {
            transform: scale(0.97);
        }

        #Button {
            width: 100%;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            background-color: #111;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        #Button:hover {
            background-color: #333;
        }

        #Button:active {
            transform: scale(0.98);
        }

        #output {
            font-size: 0.95rem;
            color: #fff;
            text-align: center;
            min-height: 24px;
            transition: 1s;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .gallery-grid-item {
            position: relative;
            width: 100%;
            max-width: 450px;
            justify-self: center;
        }

        .gallery-grid-item>img {
            width: 100%;
            aspect-ratio: 1 / 1;
            padding: 40px;
            background-color: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: block;
            margin: 0 auto;
            box-sizing: border-box;
            object-fit: contain;
            filter: brightness(0.95) contrast(1.05);
            opacity: 0;
            transform: scale(0.98);
            animation: cinematicFade 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
            border: none;
            background: none;
            width: 28px;
            height: 28px;
        }

        .btn::after {
            content: "×";
            position: absolute;
            inset: 0;
            background-color: #ff4d4d;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover::after {
            background-color: #e60000;
            transform: scale(1.05);
        }

        @keyframes cinematicFade {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        html {
            scroll-behavior: smooth;
        }


        .header-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .topbtn {
            height: 32px;
            padding: 0 14px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: capitalize;
            color: #fff;
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .topbtn:hover {
            background-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
        }

        .topbtn:active {
            transform: scale(0.95);
        }

        #clearsaved {
            background-color: red !important;
        }
    </style>
</head>

<body>
    <div id="mobile-blocker">
        <h2>This app is not available on mobile devices.</h2>
    </div>
    <div class="gallery-container">
        <header class="gallery-header">
            <div class="header-buttons">

                <button id="jmpbtn" class="topbtn">jump to bottom</button>
                <button id="clearsaved" class="topbtn">Clear site data</button>
                <br>
                <button class="circle-btn btn-green" aria-label="Green theme" id="green"></button>
                <button class="circle-btn btn-blue" aria-label="Blue theme" id="blue"></button>
                <button class="circle-btn btn-red" aria-label="Red theme" id="red"></button>
                <button class="circle-btn btn-purple" aria-label="Purple theme" id="purple"></button>

            </div>
            <br><br>
            <h1>Editorial Image Gallery</h1>
            <p id="PA">A curated collection of images</p>
        </header>
        <div class="gallery-controls">
            <input id="Input" placeholder="Enter image URL...">
            <input type="file" id="fileinput" accept="image/*">
            <button id="Button">Add Image</button>
            <div id="output"></div>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <script>

        let clrbtn = document.getElementById("clearsaved");

        clrbtn.addEventListener("click", function () {
            if (clrbtn.textContent === "Clear site data") {
                clrbtn.textContent = "Are you sure?";
            } else {
                localStorage.clear();

                if (db) {
                    const transaction = db.transaction("images", "readwrite");
                    transaction.objectStore("images").clear();
                }

                clrbtn.textContent = "Clear site data";
                document.getElementById("galleryGrid").innerHTML = "";
            }
        });

        document.getElementById("jmpbtn").addEventListener("click", function () {
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: "smooth"
            })
        });

        document.addEventListener("DOMContentLoaded", function () {
            if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                document.body.innerHTML = '<h2>This app is not available on mobile devices.</h2>';
            }
        });

        let output = document.getElementById("output");
        let Input = document.getElementById("Input");
        let Button = document.getElementById("Button");
        let fileinput = document.getElementById("fileinput");

        let db = null;

        const dbRequest = indexedDB.open("LocalGalleryDB", 1);

        dbRequest.onupgradeneeded = (e) => {
            db = e.target.result;
            db.createObjectStore("images", { autoIncrement: true });
        };

        dbRequest.onsuccess = (e) => {
            db = e.target.result;
            iscolor();
            loadimg();
        };

        dbRequest.onerror = () => {
            output.textContent = "Error initializing local media storage";
        };

        function getImages() {
            let data = localStorage.getItem("theImage");
            return data ? JSON.parse(data) : [];
        }

        function appendElements(url, dbKey = null) {
            let grid = document.getElementById("galleryGrid");

            let wrapper = document.createElement("div");
            wrapper.className = "gallery-grid-item";

            let img = document.createElement("img");
            img.src = url;

            let btn = document.createElement("button");
            btn.className = "btn";

            btn.addEventListener("click", function () {
                wrapper.remove();

                if (dbKey !== null && db) {
                    const transaction = db.transaction("images", "readwrite");
                    transaction.objectStore("images").delete(dbKey);
                    URL.revokeObjectURL(url);
                } else {
                    let images = getImages().filter(i => i !== url);
                    localStorage.setItem("theImage", JSON.stringify(images));
                }
            });

            wrapper.appendChild(img);
            wrapper.appendChild(btn);
            grid.appendChild(wrapper);
        }

        fileinput.addEventListener('change', (event) => {
            const selectedFile = event.target.files[0];

            if (selectedFile && db) {
                const transaction = db.transaction("images", "readwrite");
                const store = transaction.objectStore("images");
                const addRequest = store.add(selectedFile);

                addRequest.onsuccess = (e) => {
                    const insertedKey = e.target.result;
                    const persistentLocalUrl = URL.createObjectURL(selectedFile);

                    appendElements(persistentLocalUrl, insertedKey);
                    fileinput.value = "";
                    output.textContent = "Local file saved";
                };
            }
        });

        async function data() {
            let input = document.getElementById("Input").value.trim();

            if (input == "") return;

            let images = getImages();
            if (images.includes(input)) return;

            output.textContent = "Fetching & Verifying image link..."

            let request = await fetch("https://image-gallery-7dng.onrender.com/app", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({ username: input })
            });
            let result = await request.json();
            output.textContent = result.message;

            if (result.message !== "Either URL is not an image or image is still loading" && result.message !== "An error occurred") {
                images.push(input);
                localStorage.setItem("theImage", JSON.stringify(images));

                appendElements(input);
                document.getElementById("Input").value = "";
            }
        }

        Button.addEventListener("click", function () {
            data();
        });

        Input.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                data();
            }
        });

        function loadimg() {
            document.getElementById("galleryGrid").innerHTML = "";


            getImages().forEach(url => appendElements(url));


            if (db) {
                const transaction = db.transaction("images", "readonly");
                const store = transaction.objectStore("images");
                const request = store.openCursor();

                request.onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (cursor) {
                        const persistentLocalUrl = URL.createObjectURL(cursor.value);
                        appendElements(persistentLocalUrl, cursor.key);
                        cursor.continue(); 
                    }
                };
            }
        }

        const colors = {
            green: `background: #0F7A17;
background: -moz-linear-gradient(left, #0F7A17 0%, #0F8E10 0%, #27BC0C 100%);
background: -webkit-linear-gradient(left, #0F7A17 0%, #0F8E10 0%, #27BC0C 100%);
background: linear-gradient(to right, #0F7A17 0%, #0F8E10 0%, #27BC0C 100%);`,
            red: `background: #B70000;
background: -moz-linear-gradient(45deg, #B70000 0%, #B20000 36%, #FF0017 100%);
background: -webkit-linear-gradient(45deg, #B70000 0%, #B20000 36%, #FF0017 100%);
background: linear-gradient(45deg, #B70000 0%, #B20000 36%, #FF0017 100%);`,
            blue: `background: #020751;
background: -moz-linear-gradient(left, #020751 0%, #042A6A 0%, #0B41B4 100%);
background: -webkit-linear-gradient(left, #020751 0%, #042A6A 0%, #0B41B4 100%);
background: linear-gradient(to right, #020751 0%, #042A6A 0%, #0B41B4 100%);`,
            purple: `background: #2F0453;
background: -moz-linear-gradient(left, #2F0453 0%, #490281 0%, #7B00D3 100%);
background: -webkit-linear-gradient(left, #2F0453 0%, #490281 0%, #7B00D3 100%);
background: linear-gradient(to right, #2F0453 0%, #490281 0%, #7B00D3 100%);`
        };

        let greenbtn = document.getElementById("green");
        let bluebtn = document.getElementById("blue");
        let purplebtn = document.getElementById("purple");
        let redbtn = document.getElementById("red");

        greenbtn.addEventListener("click", function () {
            document.body.style.cssText = colors.green;
            localStorage.setItem("theme", "green");
        });

        bluebtn.addEventListener("click", function () {
            document.body.style.cssText = colors.blue;
            localStorage.setItem("theme", "blue");
        });

        redbtn.addEventListener("click", function () {
            document.body.style.cssText = colors.red;
            localStorage.setItem("theme", "red");
        });

        purplebtn.addEventListener("click", function () {
            document.body.style.cssText = colors.purple;
            localStorage.setItem("theme", "purple");
        });

        function iscolor() {
            let Theme = localStorage.getItem("theme");
            if (Theme && colors[Theme]) {
                document.body.style.cssText = colors[Theme];
            }
        }


    </script>

</body>

</html>
